try {
  var x = new XMLHttpRequest();
  x.open('POST', '/__report', false);
  x.setRequestHeader('Content-Type', 'text/plain');
  x.send('BREADCRUMB A-head-before-gamejs | t=' + Math.round(performance.now()) + 'ms | readyState=' + document.readyState);
} catch (e) {}
</script>
<script>
window.__diag = { errors: [] };
window.addEventListener('error', function(e){
  try { var x=new XMLHttpRequest(); x.open('POST','/__report',false);
    x.send('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno); } catch(_) {}
}, true);
window.addEventListener('unhandledrejection', function(e){
  var r = e.reason;
  try { var x=new XMLHttpRequest(); x.open('POST','/__report',false);
    x.send('REJECTION: ' + (r && (r.stack || r.message) || String(r))); } catch(_) {}
});
</script>
<script type="text/javascript" src="game.js"></script><script>
try {

<script>
setTimeout(function(){
  try { var x=new XMLHttpRequest(); x.open('POST','/__report',false);
    x.send('TIMER 2000ms fired | readyState=' + document.readyState); } catch(_) {}
}, 2000);
setTimeout(function(){
  var info = {};
  try {
    info.href = location.href;
    info.readyState = document.readyState;
    info.bodyChildren = document.body ? document.body.children.length : -1;
    info.totalElements = document.querySelectorAll('*').length;
    info.hasCanvas = !!document.getElementById('canvas');
    info.hasIg = (typeof ig !== 'undefined');
    if (info.hasIg) {
      info.waitForOnload = ig['_waitForOnload'];
      info.modules = Object.keys(ig.modules || {}).map(function(k){ return k + ':' + (ig.modules[k] && ig.modules[k].loaded); });
    }
  } catch (e) { info.probeError = String(e && e.stack || e); }
  try { var x=new XMLHttpRequest(); x.open('POST','/__report',false);
    x.send('TIMER 9000ms fired | ' + JSON.stringify(info)); } catch(_) {}
}, 9000);
</script>
