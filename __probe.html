    <script>
window.__diag = { tl: [], errors: [] };
var __t0 = Date.now();
function __L(m){ window.__diag.tl.push(m + ' +' + (Date.now()-__t0) + 'ms'); }
document.addEventListener('DOMContentLoaded', function(){ __L('DOMContentLoaded'); }, true);
window.addEventListener('load', function(){ __L('window.load'); }, true);
window.addEventListener('error', function(e){
  window.__diag.errors.push('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno);
}, true);
window.addEventListener('unhandledrejection', function(e){
  var r = e.reason; window.__diag.errors.push('REJECTION: ' + (r && (r.stack || r.message) || String(r)));
});
(function(){
  var ce = console.error, cw = console.warn;
  console.error = function(){ window.__diag.errors.push('console.error: ' + Array.prototype.join.call(arguments,' ')); return ce.apply(console, arguments); };
  console.warn  = function(){ window.__diag.errors.push('console.warn: '  + Array.prototype.join.call(arguments,' ')); return cw.apply(console, arguments); };
})();
</script>

<script>
setTimeout(function(){
  var d = window.__diag, info = {};
  try {
    info.href = location.href;
    info.readyState = document.readyState;
    info.timeline = d.tl;
    info.errors = d.errors;
    info.bodyExists = !!document.body;
    info.bodyChildren = document.body ? document.body.children.length : -1;
    info.totalElements = document.querySelectorAll('*').length;
    info.hasCanvas = !!document.getElementById('canvas');
    info.hasIg = (typeof ig !== 'undefined');
    info.hasBabylon = (typeof BABYLON !== 'undefined');
    if (info.hasIg) {
      info.waitForOnload = ig['_waitForOnload'];
      info.modules = Object.keys(ig.modules || {}).map(function(k){
        return k + ':' + (ig.modules[k] && ig.modules[k].loaded);
      });
    }
  } catch (e) { info.probeError = String(e && e.stack || e); }
  var payload = JSON.stringify(info);
  try { fetch('/__report', { method: 'POST', body: payload }); } catch (e) {}
}, 12000);
</script>
